<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="game.css">
</head>

<body>
    <div class="gamebody">
        <h1>Simon Says Game</h1>
        <h2 class="level">Press the start button to start the game</h2>

        <button class="main-button">Start The Game</button>
        <h2 class="Highscore">Highest Score = 0</h2>

        <div class="button-container">
            <div class="line-1">
                <div class="button btn1" type="button" id="pink"></div>
                <div class="button btn2" type="button" id="blue"></div>
            </div>
            <div class="line-2">
                <div class="button btn3" type="button" id="yellow"></div>
                <div class="button btn4" type="button" id="red"></div>
            </div>


        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
